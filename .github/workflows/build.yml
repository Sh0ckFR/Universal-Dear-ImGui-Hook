name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  msvc:
    name: MSVC ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }} -DUIH_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test (WARP)
        run: build\tests\Release\uih_host.exe --api d3d11 --warp
      - name: Proxy test
        run: build\tests\Release\uih_host.exe --proxy build\Release\Universal-ImGui-Hook.dll
      - uses: actions/upload-artifact@v4
        with:
          name: Universal-ImGui-Hook-msvc-${{ matrix.arch }}
          path: build/Release/Universal-ImGui-Hook.dll

  # The CTest suite on a runner without GPU: WARP for Direct3D, Mesa's
  # llvmpipe and lavapipe for OpenGL and Vulkan.
  windows-tests:
    name: Windows tests ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            dir: x64
            registry: HKLM:\SOFTWARE\Khronos\Vulkan\Drivers
          - arch: Win32
            dir: x86
            registry: HKLM:\SOFTWARE\WOW6432Node\Khronos\Vulkan\Drivers
    env:
      MESA: 26.2.4
      VULKAN_RUNTIME: 1.4.363.0
      # Mesa's llvmpipe for the suite; its D3D12-based driver is tested on its own below.
      GALLIUM_DRIVER: llvmpipe
      # The runner's display can change modes: the fullscreen scenarios run.
      UIH_TEST_FULLSCREEN: 1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }} -DUIH_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Install software drivers
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 3 -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA/mesa3d-$env:MESA-release-msvc.7z"
          7z x mesa.7z -omesa | Out-Null
          curl.exe -fsSL --retry 3 -o vulkan.zip "https://sdk.lunarg.com/sdk/download/$env:VULKAN_RUNTIME/windows/vulkan-runtime-components.zip"
          Expand-Archive vulkan.zip vulkan
          $tests = "build/tests/Release"
          # dxil.dll signs the shaders of Mesa's D3D12-based driver.
          Copy-Item mesa/${{ matrix.dir }}/opengl32.dll, mesa/${{ matrix.dir }}/libgallium_wgl.dll, mesa/${{ matrix.dir }}/dxil.dll $tests
          Copy-Item (Get-ChildItem vulkan -Recurse -Filter vulkan-1.dll | Where-Object { $_.Directory.Name -eq "${{ matrix.dir }}" }).FullName $tests
          # The runner is elevated, so the Vulkan loader ignores VK_DRIVER_FILES: lavapipe is registered instead.
          $icd = (Get-ChildItem mesa/${{ matrix.dir }} -Filter "lvp_icd.*.json").FullName
          New-Item -Path "${{ matrix.registry }}" -Force | Out-Null
          New-ItemProperty -Path "${{ matrix.registry }}" -Name $icd -Value 0 -PropertyType DWord -Force | Out-Null
      - name: Test
        shell: bash
        run: |
          ctest --test-dir build -C Release --output-on-failure --timeout 120 | tee ctest.log
          # DirectInput does not see simulated key presses on the runner.
          if grep Skipped ctest.log | grep -v input_directinput; then exit 1; fi
      # OpenGL on Direct3D 12 (GLOn12), the driver of Microsoft's OpenGL compatibility pack.
      - name: Test OpenGL on Mesa's D3D12 driver
        shell: bash
        env:
          GALLIUM_DRIVER: d3d12
        run: |
          ctest --test-dir build -C Release --output-on-failure --timeout 120 -R opengl | tee ctest-d3d12.log
          if grep Skipped ctest-d3d12.log; then exit 1; fi
      # The D3D debug layers are an optional Windows feature.
      - name: Install the Direct3D debug layers
        shell: pwsh
        run: Add-WindowsCapability -Online -Name "Tools.Graphics.DirectX~~~~0.0.1.0"
      - name: Test Direct3D 10 to 12 with the debug layers
        shell: bash
        env:
          UIH_TEST_D3D_DEBUG: 1
        run: |
          ctest --test-dir build -C Release -V -R "d3d1[012]" -E fullscreen --timeout 120 > ctest-debug.log 2>&1 || true
          grep -E "Test +#|DEBUG LAYER ERROR|tests passed" ctest-debug.log
          if grep -qE "Skipped|Failed|DEBUG LAYER ERROR" ctest-debug.log; then exit 1; fi
      # The Vulkan SDK ships its validation layer for 64-bit applications only.
      - name: Install the Vulkan validation layer
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 3 -o vulkansdk.exe "https://sdk.lunarg.com/sdk/download/$env:VULKAN_RUNTIME/windows/vulkansdk-windows-X64-$env:VULKAN_RUNTIME.exe"
          $installer = Start-Process -Wait -PassThru -NoNewWindow -FilePath .\vulkansdk.exe -ArgumentList "--root", "C:\VulkanSDK", "--accept-licenses", "--default-answer", "--confirm-command", "install"
          if ($installer.ExitCode -ne 0) { throw "Vulkan SDK installer exit code $($installer.ExitCode)" }
          # Registered like lavapipe: the elevated loader ignores VK_LAYER_PATH.
          $key = "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name "C:\VulkanSDK\Bin\VkLayer_khronos_validation.json" -Value 0 -PropertyType DWord -Force | Out-Null
      - name: Test Vulkan with the validation layer
        if: matrix.arch == 'x64'
        shell: bash
        env:
          UIH_TEST_VULKAN_VALIDATION: 1
        run: |
          ctest --test-dir build -C Release -V -R vulkan --timeout 120 > ctest-validation.log 2>&1 || true
          grep -E "Test +#|VALIDATION ERROR|tests passed" ctest-validation.log
          if grep -qE "Skipped|Failed|VALIDATION ERROR" ctest-validation.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-tests-${{ matrix.arch }}
          path: build/tests/*.bmp
          if-no-files-found: ignore

  solution:
    name: Visual Studio solution ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild Universal-ImGui-Hook.sln -m -p:Configuration=Release -p:Platform=${{ matrix.platform }}
      - name: Smoke test (WARP)
        run: build\vs\${{ matrix.platform }}\Release\uih_host.exe --api d3d11 --warp
      - name: Proxy test
        run: build\vs\${{ matrix.platform }}\Release\uih_host.exe --proxy build\vs\${{ matrix.platform }}\Release\Universal-ImGui-Hook.dll

  mingw:
    name: MinGW-w64 ${{ matrix.arch }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            preset: mingw-x64
            install: sudo apt-get update && sudo apt-get install -y ninja-build g++-mingw-w64-x86-64
          - os: ubuntu-latest
            arch: i686
            preset: mingw-x86
            install: sudo apt-get update && sudo apt-get install -y ninja-build g++-mingw-w64-i686
          - os: macos-latest
            arch: x86_64
            preset: mingw-x64
            install: brew install ninja mingw-w64
          - os: macos-latest
            arch: i686
            preset: mingw-x86
            install: brew install ninja mingw-w64
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: ${{ matrix.install }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DUIH_BUILD_TESTS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Check the proxy export
        run: ${{ matrix.arch }}-w64-mingw32-objdump -p build/${{ matrix.preset }}/Universal-ImGui-Hook.dll | grep -E ' DirectInput8Create$'
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: Universal-ImGui-Hook-mingw-${{ matrix.arch }}
          path: build/${{ matrix.preset }}/Universal-ImGui-Hook.dll

  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
            arch: x86_64
            runner: ubuntu-24.04
          - compiler: Clang
            cc: clang
            cxx: clang++
            arch: x86_64
            runner: ubuntu-24.04
          - compiler: GCC
            cc: gcc
            cxx: g++
            arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libxcb1-dev libx11-dev libxtst-dev libgl-dev libegl-dev xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
      - name: Configure
        run: cmake --preset linux -DUIH_BUILD_TESTS=ON
      - name: Build
        run: cmake --build --preset linux
      - name: Check the exported functions
        run: |
          sed -n 's/^ *\([A-Za-z0-9_]*\);$/\1/p' src/linux/exports.map | sort > expected.txt
          nm -D --defined-only build/linux/Universal-ImGui-Hook.so | awk '{print $NF}' | sort > exported.txt
          diff expected.txt exported.txt
      - name: Check the runtime dependencies
        run: |
          readelf -d build/linux/Universal-ImGui-Hook.so | grep NEEDED
          if readelf -d build/linux/Universal-ImGui-Hook.so | grep -E 'libstdc\+\+|libgcc_s'; then exit 1; fi
      - name: Test
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ctest --test-dir build/linux --output-on-failure | tee ctest.log
          if grep Skipped ctest.log; then exit 1; fi
      - name: Test Vulkan with the validation layer
        shell: bash
        env:
          UIH_TEST_VULKAN_VALIDATION: 1
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ctest --test-dir build/linux -V -R vulkan > ctest-validation.log 2>&1 || true
          grep -E "Test +#|VALIDATION ERROR|tests passed" ctest-validation.log
          if grep -qE "Skipped|Failed|VALIDATION ERROR" ctest-validation.log; then exit 1; fi

  # The preload tests with the library built with AddressSanitizer and
  # UndefinedBehaviorSanitizer.
  linux-sanitizers:
    name: Linux sanitizers (ASan, UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libxcb1-dev libx11-dev libxtst-dev libgl-dev libegl-dev xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libvulkan1 mesa-vulkan-drivers
      - name: Configure
        run: cmake --preset linux -DUIH_BUILD_TESTS=ON -DUIH_SANITIZE=ON
      - name: Build
        run: cmake --build --preset linux
      - name: Test
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ctest --test-dir build/linux --output-on-failure | tee ctest.log
          if grep Skipped ctest.log; then exit 1; fi

  # Built against an old glibc so the released library loads on older systems.
  linux-portable:
    name: Linux portable ${{ matrix.arch }} (glibc 2.28)
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y pkgconf-pkg-config libxcb-devel libX11-devel libXtst-devel libglvnd-devel mesa-libGL-devel mesa-libEGL-devel \
            xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers mesa-vulkan-drivers vulkan-loader
          command -v cmake || pipx install cmake
          command -v ninja || pipx install ninja
      - name: Configure
        run: cmake --preset linux -DUIH_BUILD_TESTS=ON
      - name: Build
        run: cmake --build --preset linux
      - name: Check the runtime dependencies
        run: |
          readelf -d build/linux/Universal-ImGui-Hook.so | grep NEEDED
          if readelf -d build/linux/Universal-ImGui-Hook.so | grep -E 'libstdc\+\+|libgcc_s'; then exit 1; fi
          required=$(objdump -T build/linux/Universal-ImGui-Hook.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "$required"
          test "$(printf '%s\n' "$required" GLIBC_2.28 | sort -V | tail -n 1)" = GLIBC_2.28
      - name: Test
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ctest --test-dir build/linux --output-on-failure | tee ctest.log
          # The EGL of these distributions has no swap_buffers_with_damage.
          if grep -E 'preload_(glx|egl).*Skipped' ctest.log | grep -v swap_with_damage; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Universal-ImGui-Hook-linux-${{ matrix.arch }}
          path: build/linux/Universal-ImGui-Hook.so

  # Released games with the released library preloaded.
  games-linux:
    name: ${{ matrix.game }} on Linux (${{ matrix.backend }})
    needs: linux-portable
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        game: [DDNet, Godot]
        backend: [OpenGL, Vulkan]
    env:
      DDNET: DDNet-20.1.1-linux_x86_64
      GODOT: Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Universal-ImGui-Hook-linux-x86_64
      # The distribution package of DDNet brings the libraries the official build needs.
      - name: Install the game
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libvulkan1 mesa-vulkan-drivers \
            ddnet libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libfontconfig1
          if [ "${{ matrix.game }}" = DDNet ]; then
            curl -fsSL --retry 3 --connect-timeout 20 --max-time 300 -o ddnet.tar.xz https://ddnet.org/downloads/$DDNET.tar.xz
            tar -xJf ddnet.tar.xz
          else
            curl -fsSL --retry 3 --connect-timeout 20 --max-time 300 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/$GODOT.zip
            unzip -q godot.zip && chmod +x $GODOT
          fi
      - name: Run DDNet with the hook preloaded
        if: matrix.game == 'DDNet'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" sh tests/game.sh Universal-ImGui-Hook.so ${{ matrix.backend }} game.png \
            $DDNET/DDNet "gfx_backend ${{ matrix.backend }}" "gfx_fullscreen 0" "gfx_screen_width 1024" "gfx_screen_height 768"
      - name: Run Godot with the hook preloaded
        if: matrix.game == 'Godot'
        run: |
          if [ "${{ matrix.backend }}" = OpenGL ]; then driver="--rendering-driver opengl3 --rendering-method gl_compatibility"; else driver="--rendering-driver vulkan"; fi
          xvfb-run -a -s "-screen 0 1280x800x24" sh tests/game.sh Universal-ImGui-Hook.so ${{ matrix.backend }} game.png \
            ./$GODOT --path "$PWD/tests/godot" $driver
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.game }}-linux-${{ matrix.backend }}
          path: game.png
          if-no-files-found: ignore

  # The same games on Windows, with the DLL injected once they render, as an
  # injector does, and without GPU as in windows-tests.
  games-windows:
    name: ${{ matrix.game }} on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        game: [DDNet, Godot]
    env:
      MESA: 26.2.4
      VULKAN_RUNTIME: 1.4.363.0
      GALLIUM_DRIVER: llvmpipe
      DDNET: DDNet-20.1.1-win64
      GODOT: Godot_v4.7.2-stable_win64
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DUIH_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --target uih_example uih_game
      - name: Install the game and software drivers
        shell: pwsh
        run: |
          if ("${{ matrix.game }}" -eq "DDNet") {
            curl.exe -fsSL --retry 3 -o game.zip "https://ddnet.org/downloads/$env:DDNET.zip"
            Expand-Archive game.zip .
            $game = $env:DDNET
          } else {
            curl.exe -fsSL --retry 3 -o game.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$env:GODOT.exe.zip"
            Expand-Archive game.zip $env:GODOT
            $game = $env:GODOT
          }
          curl.exe -fsSL --retry 3 -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA/mesa3d-$env:MESA-release-msvc.7z"
          7z x mesa.7z -omesa | Out-Null
          curl.exe -fsSL --retry 3 -o vulkan.zip "https://sdk.lunarg.com/sdk/download/$env:VULKAN_RUNTIME/windows/vulkan-runtime-components.zip"
          Expand-Archive vulkan.zip vulkan
          if ("${{ matrix.game }}" -eq "DDNet") {
            Copy-Item mesa/x64/opengl32.dll, mesa/x64/libgallium_wgl.dll $game
          }
          if (-not (Test-Path "$game/vulkan-1.dll")) {
            Copy-Item (Get-ChildItem vulkan -Recurse -Filter vulkan-1.dll | Where-Object { $_.Directory.Name -eq "x64" }).FullName $game
          }
          $icd = (Get-ChildItem mesa/x64 -Filter "lvp_icd.*.json").FullName
          New-Item -Path HKLM:\SOFTWARE\Khronos\Vulkan\Drivers -Force | Out-Null
          New-ItemProperty -Path HKLM:\SOFTWARE\Khronos\Vulkan\Drivers -Name $icd -Value 0 -PropertyType DWord -Force | Out-Null
      - name: DDNet with OpenGL
        if: matrix.game == 'DDNet' && !cancelled()
        run: build\tests\Release\uih_game.exe --dll build\Release\Universal-ImGui-Hook.dll --backend OpenGL --captures ddnet-opengl -- "$env:DDNET\DDNet.exe" "gfx_backend OpenGL" "gfx_fullscreen 0" "gfx_screen_width 1024" "gfx_screen_height 768"
      - name: DDNet with Vulkan
        if: matrix.game == 'DDNet' && !cancelled()
        run: build\tests\Release\uih_game.exe --dll build\Release\Universal-ImGui-Hook.dll --backend Vulkan --captures ddnet-vulkan -- "$env:DDNET\DDNet.exe" "gfx_backend Vulkan" "gfx_fullscreen 0" "gfx_screen_width 1024" "gfx_screen_height 768"
      - name: Godot with D3D12
        if: matrix.game == 'Godot' && !cancelled()
        run: build\tests\Release\uih_game.exe --dll build\Release\Universal-ImGui-Hook.dll --backend D3D12 --captures godot-d3d12 -- "$env:GODOT\$env:GODOT.exe" --path "$pwd\tests\godot" --rendering-driver d3d12
      - name: Godot with Vulkan
        if: matrix.game == 'Godot' && !cancelled()
        run: build\tests\Release\uih_game.exe --dll build\Release\Universal-ImGui-Hook.dll --backend Vulkan --captures godot-vulkan -- "$env:GODOT\$env:GODOT.exe" --path "$pwd\tests\godot" --rendering-driver vulkan
      # Godot does not create its OpenGL window with llvmpipe: ANGLE draws its
      # OpenGL renderer with Direct3D 11.
      - name: Godot with D3D11
        if: matrix.game == 'Godot' && !cancelled()
        run: build\tests\Release\uih_game.exe --dll build\Release\Universal-ImGui-Hook.dll --backend D3D11 --captures godot-d3d11 -- "$env:GODOT\$env:GODOT.exe" --path "$pwd\tests\godot" --rendering-driver opengl3_angle --rendering-method gl_compatibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.game }}-windows
          path: '*.bmp'
          if-no-files-found: ignore

  consumer:
    name: FetchContent consumer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests/consumer -B build -A x64 -DUIH_GIT_REPOSITORY=${{ github.server_url }}/${{ github.repository }}.git -DUIH_GIT_TAG=${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build
        run: cmake --build build --config Release

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [msvc, windows-tests, solution, mingw, linux, linux-sanitizers, linux-portable, games-linux, games-windows, consumer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only MSVC builds of the Windows DLL survive an exception in the overlay.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Universal-ImGui-Hook-*
      - name: Name the libraries after their toolchain
        run: |
          mkdir release
          for file in artifacts/Universal-ImGui-Hook-msvc-*/Universal-ImGui-Hook.dll artifacts/Universal-ImGui-Hook-linux-*/Universal-ImGui-Hook.so; do
            cp "$file" "release/$(basename "$(dirname "$file")").${file##*.}"
          done
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
