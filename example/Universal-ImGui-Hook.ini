; Hotkeys of Universal-ImGui-Hook, read when the library is loaded.
; Keep this file next to Universal-ImGui-Hook.dll / .so, or set the
; UIH_CONFIG environment variable to its path. A missing file, entry or
; value not understood keeps the default shown here.

[keys]
; Opens and closes the menu.
menu_key = INSERT
; Removes the overlay, and unloads the DLL on Windows.
unload_key = F11
; Controller buttons held together to open and close the menu (Windows).
menu_buttons = L3+R3

; Key names: A-Z, 0-9, F1-F24, NUMPAD0-NUMPAD9, INSERT, DELETE, HOME, END,
; PAGEUP, PAGEDOWN, UP, DOWN, LEFT, RIGHT, TAB, ESCAPE, SPACE, BACKSPACE,
; ENTER, PAUSE, SCROLLLOCK, GRAVE, NONE, or a raw code such as 0x2D
; (virtual-key code on Windows, X11 keysym on Linux).
; Button names, joined with +: A, B, X, Y, L1, R1, L3, R3, START, BACK,
; DPAD_UP, DPAD_DOWN, DPAD_LEFT, DPAD_RIGHT, or NONE.
